# Servidor web da imagem autossuficiente (single-container) usada no GHCR/deploy.
# Serve o Laravel em :8080 e encaminha PHP para o php-fpm local (127.0.0.1:9000).
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    root /app/public;
    index index.php;

    client_max_body_size 2048M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
