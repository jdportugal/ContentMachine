[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

# Without these three, supervisord runs but opens no control socket, so
# `supervisorctl status/stop/start` in the container answers
# "unix:///var/run/supervisor.sock no such file" — leaving no way to see what the
# worker is doing, or to stop it to measure a render on an idle box. The socket
# is inside the container and reachable only through `docker compose exec`.
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

# The HTTP app. `php artisan serve` is single-threaded — fine here because the
# heavy work (renders, transcription) runs in the worker, not the web request.
[program:web]
command=php artisan serve --host=0.0.0.0 --port=8080
directory=/app
autostart=true
autorestart=true
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

# Queue worker (renders, planning, image/audio generation). --timeout stays
# below the queue retry_after so a long render is never retried mid-flight. Both
# default in docker/entrypoint.sh and are settable from the compose file.
#
# Queue ORDER is priority: `default` is drained before a single `previews` job is
# taken. Opening the SFX studio can queue a preview per effect per framing, and on
# one shared queue that backlog sat in front of the next generation for as long as
# it took to render — the studio felt fast while everything else waited.
[program:worker]
command=php artisan queue:work --queue=default,previews --tries=3 --sleep=3 --rest=1 --timeout=%(ENV_QUEUE_TIMEOUT)s
directory=/app
autostart=true
autorestart=true
stopwaitsecs=%(ENV_QUEUE_TIMEOUT)s
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

# Laravel scheduler (aggregator cadence, etc.).
[program:scheduler]
command=php artisan schedule:work
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
