[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

# The HTTP app. `php artisan serve` is single-threaded — fine here because the
# heavy work (renders, transcription) runs in the worker, not the web request.
[program:web]
command=php artisan serve --host=0.0.0.0 --port=8080
directory=/app
autostart=true
autorestart=true
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

# Queue worker (renders, planning, image/audio generation). --timeout stays
# below the queue retry_after (1800) so a long render is never retried mid-flight.
[program:worker]
command=php artisan queue:work --tries=3 --sleep=3 --rest=1 --timeout=1700
directory=/app
autostart=true
autorestart=true
stopwaitsecs=1710
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

# Laravel scheduler (aggregator cadence, etc.).
[program:scheduler]
command=php artisan schedule:work
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
