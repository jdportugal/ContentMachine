# Local dev / single-host run of the combined image. Everything (web + worker +
# scheduler) runs in the one `app` container. For a public HTTPS deploy behind
# Caddy on a Droplet, use deploy/install.sh instead.
services:
  app:
    build:
      context: .
    image: contentmachine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    # Runs in the offline 'fake' driver by default. To add API keys, copy
    # .env.example → .env and run:  docker compose --env-file .env up -d
    environment:
      APP_URL: ${APP_URL:-http://localhost:8080}
      # Nightly social collection runs at 00:00 in THIS timezone. Defaults to the
      # host's, so "midnight" is your midnight rather than UTC.
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      # Output ceiling for the clip/SFX LLM calls — an SFX response is a whole TSX
      # component wrapped in JSON, and too low a ceiling truncates it mid-file.
      CLIPS_MAX_TOKENS: ${CLIPS_MAX_TOKENS:-16000}
      # Seconds one model call may take before it is retried from scratch.
      CLIPS_LLM_TIMEOUT: ${CLIPS_LLM_TIMEOUT:-600}
      # Seconds one Remotion render may take. Must stay below the worker's
      # --timeout (1700) and the queue's retry_after (1800) — raise all three.
      # The three render ceilings, in the order they must hold:
      #   CLIPS_RENDER_TIMEOUT < QUEUE_TIMEOUT < DB_QUEUE_RETRY_AFTER
      CLIPS_RENDER_TIMEOUT: ${CLIPS_RENDER_TIMEOUT:-3000}
      QUEUE_TIMEOUT: ${QUEUE_TIMEOUT:-3300}
      DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-3600}
      # Frames painted in parallel. Empty = one per core. Each one in flight is
      # another headless Chrome tab — lower it if RAM runs out before cores do.
      CLIPS_RENDER_CONCURRENCY: ${CLIPS_RENDER_CONCURRENCY:-0}
    volumes:
      - storage:/app/storage
      - vault:/app/vault
      - db:/app/database

volumes:
  storage:
  vault:
  db:
