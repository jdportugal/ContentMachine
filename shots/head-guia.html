        <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Quantos vídeos posso pôr num anúncio do idealista?\n\nAté 6 vídeos por anúncio, cada um com até 750 MB.\n\n### O idealista aceita vídeos do YouTube?\n\nO centro de ajuda do idealista fala apenas em carregar ficheiros de vídeo (MP4, MOV, AVI e outros). Carregue o ficheiro diretamente.\n\n### O vídeo pode ser vertical?\n\nO idealista não indica uma orientação obrigatória. Um vídeo vertical serve também para Reels, TikTok e estados do WhatsApp, por isso é o que faz render mais o mesmo trabalho.\n\n### Posso fazer o vídeo a partir do link do idealista?\n\nNa Imocena, não: o idealista não permite que o leiamos. Use o link do mesmo imóvel no site da sua agência.","acceptedAnswer":{"@type":"Answer","text":""}}]}</script>
